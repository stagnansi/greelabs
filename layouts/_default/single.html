{{ define "main" }}
<h1>{{ .Title }}</h1>

{{ if eq .Section "blog" }}
<p>
  <i>
    <time datetime='{{ .Date.Format "2006-01-02" }}' pubdate>
      {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
    </time>
  </i>
</p>
{{ end }}

<content>
  {{ .Content }}
</content>

{{ partial "post_navigator.html" . }}
{{ end }}
